<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" role="img" aria-label="DARE ARENA">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#37e2d6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0c6e72" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ffff4"/>
      <stop offset="50%" stop-color="#2fe0d6"/>
      <stop offset="100%" stop-color="#0c6e72"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfeee9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="820" height="280" rx="20" fill="#08090c"/>
  <ellipse cx="290" cy="140" rx="240" ry="150" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbit rings (arena / infinite) -->
  <g fill="none" stroke="#2fe0d6" stroke-opacity="0.35">
    <ellipse cx="290" cy="140" rx="150" ry="60" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 290 140" to="360 290 140" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="290" cy="140" rx="120" ry="120" stroke-width="1" stroke-opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" from="360 290 140" to="0 290 140" dur="34s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- diamond emblem -->
  <g transform="translate(290 140)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="4.5s" repeatCount="indefinite" additive="sum"/>
      <path d="M0 -78 L78 0 L0 78 L-78 0 Z" fill="url(#dia)" opacity="0.9" filter="url(#soft)"/>
      <path d="M0 -78 L78 0 L0 78 L-78 0 Z" fill="none" stroke="#8ffff4" stroke-width="3"/>
      <path d="M0 -50 L50 0 L0 50 L-50 0 Z" fill="#08090c"/>
      <path d="M0 -50 L50 0 L0 50 L-50 0 Z" fill="none" stroke="#2fe0d6" stroke-width="2" stroke-opacity="0.7"/>
      <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="56" fill="url(#ice)">D</text>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(500 116)">
    <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="2" fill="url(#ice)">DARE</text>
    <text x="4" y="46" font-family="Consolas, monospace" font-weight="700" font-size="21" letter-spacing="15" fill="#2fe0d6">ARENA</text>
    <text x="6" y="82" font-family="Consolas, monospace" font-size="13" letter-spacing="3" fill="#8fa6ae">A 3D STADIUM PORTFOLIO · BUILT TO SHIP</text>
  </g>

  <!-- twinkles -->
  <g fill="#eafcff">
    <circle cx="140" cy="70" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="210" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="215" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
